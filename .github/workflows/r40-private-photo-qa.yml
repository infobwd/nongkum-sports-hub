name: R40 Private Photo Security QA
on:
  pull_request:
    branches: [main]
    paths:
      - "upload-photos.html"
      - "review-photos.html"
      - "activity-photos.html"
      - "results.html"
      - "js/activity-media-r40g.js"
      - "js/activity-gallery-r40g.js"
      - "js/results-renderers.js"
      - "css/activity-gallery-r40g.css"
      - "js/upload-photos-r40.js"
      - "js/review-photos-r40.js"
      - "css/activity-photos.css"
      - "supabase/functions/nongkum-activity-photos/**"
      - "supabase/migrations/*r40*"
      - "scripts/r40/**"
      - ".github/workflows/r40-private-photo-qa.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/nongkum-activity-photos/**"
      - "scripts/r40/**"
      - ".github/workflows/r40-private-photo-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Private media permissions and Deno TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify upload permissions, consent gate, and regression invariants
        run: node scripts/r40/test-r40.mjs
      - name: Verify R40-G public publication is opt-in and isolated from private uploads
        run: node scripts/r40/test-r40g-publication.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check deployed function source
        run: deno check supabase/functions/nongkum-activity-photos/index.ts
      - name: Verify actual binary request to private Storage
        run: deno test supabase/functions/nongkum-activity-photos/private-upload.test.ts
      - name: Verify Safari JPEG metadata removal
        run: deno test supabase/functions/nongkum-activity-photos/jpeg-clean.test.ts
