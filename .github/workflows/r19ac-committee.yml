name: R19-A/C committee report
on:
  pull_request:
    branches: ["main"]
    paths:
      - "committee.html"
      - "committee-pdf-viewer.html"
      - "js/committee-pdf-preview.js"
      - "js/pdf-viewer.js"
      - "assets/souvenir-committee-2569-v3.pdf"
      - "css/committee.css"
      - "js/committee.js"
      - "data/committee-roles-2569-planning.json"
      - "data/committee-2569-draft-public-review.json"
      - "scripts/committee/**"
      - "docs/R19AC_COMMITTEE_REPORT_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/r19ac-committee.yml"
  push:
    branches: ["main"]
    paths:
      - "committee.html"
      - "committee-pdf-viewer.html"
      - "js/committee-pdf-preview.js"
      - "js/pdf-viewer.js"
      - "assets/souvenir-committee-2569-v3.pdf"
      - "css/committee.css"
      - "js/committee.js"
      - "data/committee-roles-2569-planning.json"
      - "scripts/committee/**"
      - ".github/workflows/r19ac-committee.yml"
permissions:
  contents: read
jobs:
  committee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check js/committee.js
      - run: node scripts/committee/test-r19ac.mjs
      - run: node scripts/committee/test-r19b.mjs
      - run: node scripts/committee/test-r19e.mjs
      - run: node scripts/committee/test-r19i-reader.mjs
