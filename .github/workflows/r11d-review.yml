name: R11D public PDF review preview
on:
  pull_request:
    paths:
      - "review.html"
      - "index.html"
      - "css/review.css"
      - "js/review*.js"
      - "js/back-to-top.js"
      - "js/pull-refresh.js"
      - "css/review-controls.css"
      - "scripts/ux/test-review-controls-r22.mjs"
      - "data/program-from-pdf-2569-20261104-draft.json"
      - "data/reconciliation/**"
      - "scripts/ux/test-review-r11d.mjs"
      - "scripts/ux/test-review-r11d1.mjs"
      - "scripts/ux/test-pdf-viewer-r11d2.mjs"
      - "scripts/ux/test-review-r11d3.mjs"
      - "scripts/ux/test-pdf-book-reader-r11d4.mjs"
      - "scripts/ux/test-review-r11d5.mjs"
      - "scripts/ux/test-unified-pdf-r11d6.mjs"
      - "pdf-viewer.html"
      - "js/pdf-viewer.js"
      - "css/pdf-viewer.css"
      - "assets/souvenir-2569-v2.pdf"
      - ".github/workflows/r11d-review.yml"
  push:
    paths:
      - "review.html"
      - "index.html"
      - "css/review.css"
      - "js/review*.js"
      - "js/back-to-top.js"
      - "js/pull-refresh.js"
      - "css/review-controls.css"
      - "scripts/ux/test-review-controls-r22.mjs"
      - "data/program-from-pdf-2569-20261104-draft.json"
      - "data/reconciliation/**"
      - "scripts/ux/test-review-r11d.mjs"
      - "scripts/ux/test-review-r11d1.mjs"
      - "scripts/ux/test-pdf-viewer-r11d2.mjs"
      - "scripts/ux/test-review-r11d3.mjs"
      - "scripts/ux/test-pdf-book-reader-r11d4.mjs"
      - "scripts/ux/test-review-r11d5.mjs"
      - "scripts/ux/test-unified-pdf-r11d6.mjs"
      - "pdf-viewer.html"
      - "js/pdf-viewer.js"
      - "css/pdf-viewer.css"
      - "assets/souvenir-2569-v2.pdf"
      - ".github/workflows/r11d-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: R11D read-only review and accessibility contracts
        run: node scripts/ux/test-review-r11d.mjs
      - name: R11D.1 teacher mobile and V2 PDF UX
        run: node scripts/ux/test-review-r11d1.mjs
      - name: R11D.2 source PDF and page-viewer routing
        run: node scripts/ux/test-pdf-viewer-r11d2.mjs
      - name: R11D.3 responsive split scroll and mobile PDF fit modes
        run: node scripts/ux/test-review-r11d3.mjs
      - name: R22 shared back-to-top and guarded pull-down on review
        run: node scripts/ux/test-review-controls-r22.mjs
      - name: R11D.4 mobile book-style PDF reader and safe return
        run: node scripts/ux/test-pdf-book-reader-r11d4.mjs
      - name: R11D.5 iOS Safe Area and review disclosure regression
        run: node scripts/ux/test-review-r11d5.mjs
      - name: R11D.6 embedded reader/header and safe-area contracts
        run: node scripts/ux/test-unified-pdf-r11d6.mjs
      - name: R11A deterministic source contract
        run: node scripts/data/reconcile-program-r11a.mjs --check
      - name: Existing program and LINE deep-link regression
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-pdf-revision-2569.mjs
          node scripts/share/build-match-pages.mjs --check
          node scripts/ux/test-direct-share-r8.mjs
          node scripts/ux/test-loading-r9.mjs
