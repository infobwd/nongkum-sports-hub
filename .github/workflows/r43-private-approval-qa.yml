name: R43 Private Schedule Approval Staging QA
on:
  pull_request:
    paths:
      - "supabase/proposals/r43_private_schedule_workflow.sql"
      - "supabase/functions/nongkum-schedule-admin/**"
      - "scripts/r43/test-private-db-*.sql"
      - "scripts/r43/test-r43-private.mjs"
      - "scripts/r43/prepare-release.mjs"
      - "scripts/r43/fixtures/**"
      - "js/r43-release-preview.js"
      - ".github/workflows/r43-private-approval-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: r43_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r43_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: r43_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Build temporary isolated R32/R33/Auth schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/r43/test-private-db-bootstrap.sql
      - name: Parse and apply R43 proposal to ISOLATED PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f supabase/proposals/r43_private_schedule_workflow.sql
      - name: Test grants, reviewer separation, R32 locks, stale revisions and committee overlaps
        run: psql -v ON_ERROR_STOP=1 -f scripts/r43/test-private-db-assertions.sql
      - name: Test release candidate preparation and security boundaries
        run: node scripts/r43/test-r43-private.mjs
