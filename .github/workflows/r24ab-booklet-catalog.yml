name: R24-A/B Booklet Catalog and Source Audit
on:
  pull_request:
    paths:
      - 'booklets.html'
      - 'index.html'
      - 'css/booklets.css'
      - 'js/booklets.js'
      - 'data/booklet-versions.json'
      - 'scripts/booklets/**'
      - 'docs/R24AB_**'
      - '.github/workflows/r24ab-booklet-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript
        run: |
          node --check js/booklets.js
          node --check scripts/booklets/test-r24ab-catalog.mjs
      - name: Verify registry, unchanged V2/V3 and 486 source ID digest
        run: node scripts/booklets/test-r24ab-catalog.mjs
      - name: Validate 155-page private audit tool syntax
        run: python -m py_compile scripts/booklets/audit-155.py
