name: R24-H Import Verified Public 155-page PDF
on:
  push:
    branches:
      - feat/r24h-public-155-pdf-v2v3-reader-20261108
    paths:
      - '.github/workflows/r24h-import-pdf.yml'
permissions:
  contents: write
jobs:
  import-verified-public-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download organizer-approved public review PDF
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0 pypdf==5.9.0
          mkdir -p assets
          gdown --id '1C1StUK5o1rXeOGzM4mOnvnwCgeuWdPRF' --output 'assets/souvenir-2569-v42i10-g2-155pages.pdf'
      - name: Verify exact immutable source before commit
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('assets/souvenir-2569-v42i10-g2-155pages.pdf')
          payload=p.read_bytes()
          expected_sha='a2a9f47f8bf871403c3995e6b4ebd102802e600fc20c16198eb12ab73b12e89d'
          assert len(payload)==4067611, f'Wrong size: {len(payload)}'
          assert payload[:5]==b'%PDF-', 'Not PDF'
          assert hashlib.sha256(payload).hexdigest()==expected_sha, 'Wrong PDF revision'
          assert len(PdfReader(str(p)).pages)==155, 'Wrong page count'
          print('R24-H source PASS:',len(payload),'bytes, 155 pages, SHA256 pinned')
          PY
      - name: Commit verified public PDF to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'assets/souvenir-2569-v42i10-g2-155pages.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'assets(r24h): add organizer-authorized verified 155-page review PDF'
            git push origin HEAD:feat/r24h-public-155-pdf-v2v3-reader-20261108
          fi
