name: R12C synthetic roster conflict analysis
on:
  pull_request:
    paths:
      - 'scripts/r12/**'
      - 'docs/R12*'
      - '.github/workflows/r12c-synthetic-conflicts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/r12/**'
      - 'docs/R12*'
      - '.github/workflows/r12c-synthetic-conflicts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests (fictional synthetic data only)
        run: node scripts/r12/test-analyze-roster-conflicts.mjs
      - name: Assert public CLI report contains no synthetic athlete or fixture IDs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/r12/analyze-roster-conflicts.mjs \
            --program scripts/r12/fixtures/r12c-synthetic-program.json \
            --roster scripts/r12/fixtures/r12c-synthetic-roster.json \
            --config scripts/r12/fixtures/r12c-synthetic-config.json \
            --public-summary /tmp/r12c-summary.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const x=readFileSync('/tmp/r12c-summary.json','utf8'); if (/SYN-ATH-|SYN-FOOT-|name_raw|display_name_private/.test(x)) process.exit(1);"
