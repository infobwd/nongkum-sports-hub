name: R40-H Mobile Upload and Reviewer Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - "upload-photos.html"
      - "review-photos.html"
      - "css/activity-photos-r40h.css"
      - "js/upload-photos-r40.js"
      - "js/review-photos-r40.js"
      - "scripts/r40/test-r40h-browser.mjs"
      - ".github/workflows/r40h-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    name: Synthetic Chrome mobile photo upload/review (no real images)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser QA
        run: npm install --no-save --ignore-scripts playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test upload receipt, no duplicate send, reviewer publication rights
        run: node scripts/r40/test-r40h-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r40h-synthetic-mobile-evidence
          path: ${{ runner.temp }}/r40h-browser-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
