name: R33 Schedule source consistency and Supabase import QA
on:
  pull_request:
    paths:
      - 'data/program-from-pdf-2569-20261104-draft.json'
      - 'js/program-corrections.js'
      - 'supabase/migrations/*r33*.sql'
      - 'supabase/seeds/r33_*.sql'
      - 'scripts/r33/**'
      - '.github/workflows/r33-schedule-source-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'data/program-from-pdf-2569-20261104-draft.json'
      - 'js/program-corrections.js'
      - 'supabase/migrations/*r33*.sql'
      - 'supabase/seeds/r33_*.sql'
      - 'scripts/r33/**'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify schedule version, safety and conflict preservation
        run: node scripts/r33/test-schedule-import.mjs
