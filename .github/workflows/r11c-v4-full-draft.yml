name: R11C V4 full draft PDF review
on:
  push:
    branches: ["feat/r11c-v4-full-draft-builder-20261106"]
    paths:
      - "scripts/docs/build-v4-full.py"
      - ".github/workflows/r11c-v4-full-draft.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-review-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Thai fonts and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core libpango-1.0-0 libharfbuzz0b
          python -m pip install "weasyprint==68.0" "PyMuPDF==1.26.7"
      - name: Build full V4 DRAFT PDF from verified repository sources
        run: python scripts/docs/build-v4-full.py --root . --out build/v4-review
      - name: Upload review PDF, HTML and 536 stable ID anchors
        uses: actions/upload-artifact@v4
        with:
          name: R11C-V4-full-draft-review
          path: |
            build/v4-review/souvenir-v4-full-draft.pdf
            build/v4-review/souvenir-v4-full-draft.html
            build/v4-review/souvenir-v4-page-map.json
            build/v4-review/souvenir-v4-qa.json
          retention-days: 30
