name: R45 Latest Approved Results Mobile QA
on:
  pull_request:
    paths:
      - 'results.html'
      - 'js/results.js'
      - 'js/results-source-r32.js'
      - 'js/results-renderers.js'
      - 'css/results.css'
      - 'scripts/r45/**'
      - '.github/workflows/r45-results-mobile-qa.yml'
  push:
    branches: [main]
    paths:
      - 'results.html'
      - 'js/results.js'
      - 'js/results-source-r32.js'
      - 'js/results-renderers.js'
      - 'css/results.css'
      - 'scripts/r45/**'
      - '.github/workflows/r45-results-mobile-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and R45 behavior tests
        run: |
          node --check js/results.js
          node --check js/results-source-r32.js
          node --check js/results-renderers.js
          node --check scripts/r45/test-latest-results.mjs
          node scripts/r45/test-latest-results.mjs
