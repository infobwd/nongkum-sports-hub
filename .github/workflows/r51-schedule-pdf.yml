name: R51 Schedule-only PDF (review)
on:
  push:
    branches:
      - feat/r51-schedule-only-pdf-r50-20261118
    paths:
      - 'scripts/r51/**'
      - 'docs/R51_SCHEDULE_ONLY_PDF_PLAN_20261118.md'
      - '.github/workflows/r51-schedule-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout requested review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install Thai fonts and PDF inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-thai-tlwg poppler-utils
          fc-cache -f
          fc-match 'Noto Sans Thai'
      - name: Install PDF renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==63.1" "pypdf==5.4.0"
      - name: Build source-pinned A4 PDF
        run: python scripts/r51/build_schedule_pdf.py
      - name: Validate PDF metadata and verified team pairs
        run: |
          set -e
          FILE=docs/exports/MittraphapGames_2569_R51_ScheduleOnly_R50_REVIEW.pdf
          pdfinfo "$FILE" | tee /tmp/r51_pdfinfo.txt
          test "$(stat -c%s "$FILE")" -gt 25000
          python - <<'PY'
          from pypdf import PdfReader
          p="docs/exports/MittraphapGames_2569_R51_ScheduleOnly_R50_REVIEW.pdf"
          r=PdfReader(p)
          text=" ".join((page.extract_text() or "") for page in r.pages)
          print("pages",len(r.pages),"extractable chars",len(text),"approved pair labels",text.count("คู่แข่งขันยืนยันจากผลรับรองแล้ว"))
          assert 10 <= len(r.pages) <= 90, "Unexpected PDF page count"
          assert len(text)>6000, "PDF text is not extractable"
          assert "มิตรภาพเกมส์" in text, "Thai font render/text extraction failed"
          assert text.count("คู่แข่งขันยืนยันจากผลรับรองแล้ว") >= 12, "Approved pair row labels missing"
          for name in ["เทเบิลเทนนิส","เปตอง","ฟุตซอล","วอลเลย์บอล","กรีฑา"]:
              assert name in text, f"Missing {name}"
          print("R51 PDF VALIDATED")
          PY
          pdftoppm -f 1 -l 1 -scale-to 1200 -png -singlefile "$FILE" /tmp/R51_schedule_cover >/dev/null 2>&1
          test -s /tmp/R51_schedule_cover.png
      - name: Upload PDF and cover preview
        uses: actions/upload-artifact@v4
        with:
          name: MittraphapGames-2569-R51-ScheduleOnly-REVIEW
          path: |
            docs/exports/MittraphapGames_2569_R51_ScheduleOnly_R50_REVIEW.pdf
            /tmp/R51_schedule_cover.png
          retention-days: 60
      - name: Save immutable review PDF on source branch (not main)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/exports/MittraphapGames_2569_R51_ScheduleOnly_R50_REVIEW.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(r51): attach verified schedule-only PDF for review [skip ci]"
            git push origin HEAD:feat/r51-schedule-only-pdf-r50-20261118
          fi
