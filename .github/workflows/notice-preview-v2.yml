name: R11C N3-A PR82 Golden Notice Layout QA (review only)
on:
  push:
    branches: ["feat/r11c-v42a-full-sarabun-fontfix-preview-20261107"]
  pull_request:
    branches: [main]
    paths:
      - "scripts/docs/notice-preview-v2.py"
      - "scripts/docs/v42_notice_pr82.py"
      - "scripts/docs/test-v42n3a-pr82-source.py"
      - "scripts/docs/test-v42n3a-pr82-pdf.py"
      - ".github/workflows/notice-preview-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice-fontfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core libpango-1.0-0 libharfbuzz0b
          python -m pip install "weasyprint==68.0" "PyMuPDF==1.26.7" "fonttools==4.60.1" "beautifulsoup4==4.14.2" "Pillow==12.0.0"
      - name: Download full Google Fonts Sarabun (OFL) in runner only
        run: |
          mkdir -p /tmp/v42a-fonts
          for font in Sarabun-Regular.ttf Sarabun-Bold.ttf; do
            curl -fLsS --retry 3 --connect-timeout 15 "https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/$font" -o "/tmp/v42a-fonts/$font"
          done
          curl -fLsS --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/OFL.txt" -o /tmp/v42a-fonts/OFL.txt
          test -s /tmp/v42a-fonts/OFL.txt
      - name: Check original V3 source contract before generation
        run: |
          python -m py_compile scripts/docs/v42_notice_pr82.py scripts/docs/notice-preview-v2.py scripts/docs/test-v42n3a-pr82-source.py scripts/docs/test-v42n3a-pr82-pdf.py
          python scripts/docs/test-v42n3a-pr82-source.py
      - name: Generate PR82 full-font 11-page notice directly from V3 source
        run: python scripts/docs/notice-preview-v2.py --source-pdf assets/souvenir-committee-2569-v3.pdf --fonts /tmp/v42a-fonts --out build/v42a-preview
      - name: Check PR82 typography, page count, role columns and searchable Thai
        run: python scripts/docs/test-v42n3a-pr82-pdf.py build/v42a-preview
      - uses: actions/upload-artifact@v4
        with:
          name: R11C-N3A-PR82-Golden-Notice-11page-review-only
          path: |
            build/v42a-preview/announcement_formal_preview_v2.pdf
            build/v42a-preview/announcement_formal_preview_v2_contact.png
            build/v42a-preview/announcement_fontfix_v2_qa.json
          retention-days: 30
