name: Validate draft data
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-data.mjs
      - run: node scripts/p2/test-approval.mjs
      - run: node scripts/ux/test-mobile-ui.mjs
      - run: node scripts/results/test-results.mjs
      - run: node scripts/results/test-exporter.mjs
      - run: node scripts/results/test-r20b-entry.mjs
      - run: node scripts/ux/test-refresh-share-forms.mjs
      - run: node scripts/ux/test-score-sheet-r5.mjs
      - run: node scripts/ux/test-mobile-navigation-r6.mjs
      - run: node scripts/ux/test-visual-consistency-r7.mjs
      - run: node scripts/share/build-match-pages.mjs --check
      - run: node scripts/ux/test-direct-share-r8.mjs
      - run: node scripts/ux/test-loading-r9.mjs
      - run: node scripts/ops/test-field-console-r10.mjs
      - run: node scripts/ops/test-public-intake-r11.mjs
      - run: node scripts/committee/test-my-duty-r19f.mjs
